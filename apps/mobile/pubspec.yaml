name: tifo
description: "South Stand Flutter mobile application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  dio: ^5.10.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  flutter_svg: ^2.3.0
  go_router: ^17.3.0
  image_picker: ^1.2.3
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true
  assets:
    - assets/ui/home/neutral-football-cover.png
    - assets/ui/home/neutral-team-crest.png
    - assets/ui/football/neutral-player-avatar.png
    - assets/ui/profile/cover-stadium.png
    - assets/ui/profile/user-demo.png
